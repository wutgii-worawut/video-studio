<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>mochi monday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&display=block" rel="stylesheet">
<style>
  :root { --paper:#fff8ec; --ink:#2b2b2b; --peach:#ffb4a2; --mint:#a8e6cf; --butter:#ffe08a; --sky:#a0d2ff; --pink:#ff9eb5; --coral:#ff8a7a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--paper); color:var(--ink); font-family:'Mali', sans-serif; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; background:var(--paper); transform-origin:0 0; }
  #cam { position:absolute; inset:0; transform-origin:50% 50%; }
  #scrub { position:fixed; left:12px; right:12px; bottom:12px; display:flex; gap:12px; align-items:center; font:600 14px/1 sans-serif; color:#333; z-index:9; }
  #scrub input { flex:1; }
  .render #scrub { display:none; }

  .dots { position:absolute; inset:-120px; background-image:radial-gradient(#e8d9c2 4px, transparent 5px); background-size:60px 60px; }
  .scene { position:absolute; inset:0; opacity:0; }
  svg .o { stroke:var(--ink); stroke-width:8; stroke-linejoin:round; stroke-linecap:round; }
  svg * { transform-box:fill-box; transform-origin:center; }
  .art { position:absolute; opacity:0; overflow:visible; }
  .ln { position:absolute; left:0; right:0; text-align:center; white-space:nowrap; opacity:0; }
  .lb { position:absolute; white-space:nowrap; opacity:0; }
  .tx { display:inline-block; font-weight:700; line-height:1.3;
        text-shadow: -5px -5px 0 var(--paper), 5px -5px 0 var(--paper), -5px 5px 0 var(--paper), 5px 5px 0 var(--paper),
                     0 -6px 0 var(--paper), 0 6px 0 var(--paper), -6px 0 0 var(--paper), 6px 0 0 var(--paper), 8px 9px 0 #00000022; }
  .bubble { background:#fff; border:7px solid var(--ink); border-radius:70px; padding:18px 44px 24px; box-shadow:8px 9px 0 #00000022; }
  .bubble .tx { text-shadow:none; }
  .pill { display:inline-block; background:var(--butter); border:7px solid var(--ink); border-radius:999px; padding:10px 46px 16px; box-shadow:8px 9px 0 #00000026; }
  .pill .tx { text-shadow:none; }
  .z { position:absolute; font-weight:700; font-size:74px; color:#7aa7d9; }
  #s3 .tx { color:var(--ink); }
  #s4 { background:var(--paper); background-image:radial-gradient(#f3dfc7 4px, transparent 5px); background-size:60px 60px; }  /* opaque: the circle reveal covers scene 3 */
</style>
<script src="../../../lib/fx.js"></script>
<script src="../../../styles/cute-doodle/mochi.js"></script>
</head>
<body>
<script src="../../../styles/cute-doodle/boil.js"></script>  <!-- line boil: .boil drawings, .boilT text -->
<div id="stage">
<div id="cam">
  <div class="dots" id="dots"></div>

  <!-- 1 · Monday 07:00, alarm rings, Mochi hides under the blanket -->
  <div class="scene" id="s1">
    <div class="ln" id="s1-date" style="top:190px"><span class="pill boilT"><span class="tx" style="font-size:48px">จันทร์ 07:00</span></span></div>
    <svg class="art boil" id="s1-clock" viewBox="0 0 300 320" style="left:640px;top:330px;width:300px;height:320px">
      <g id="clock-lines" class="o" fill="none" stroke-width="7">
        <path d="M18 120 Q4 160 18 200"/><path d="M2 100 Q-16 160 2 220"/><path d="M282 120 Q296 160 282 200"/><path d="M298 100 Q316 160 298 220"/>
      </g>
      <g id="clock-body" style="transform-origin:50% 100%">
        <path class="o" d="M150 28 V6 M118 10 H182" fill="none"/>
        <circle class="o" cx="82" cy="62" r="38" fill="#ffe08a"/><circle class="o" cx="218" cy="62" r="38" fill="#ffe08a"/>
        <path class="o" d="M95 268 L72 305 M205 268 L228 305" fill="none"/>
        <circle class="o" cx="150" cy="170" r="110" fill="#ffe08a"/>
        <circle class="o" cx="150" cy="170" r="84" fill="#fff"/>
        <path class="o" d="M150 98 V112 M150 228 V242 M78 170 H92 M208 170 H222" fill="none" stroke-width="7"/>
        <path class="o" d="M150 170 V118 M150 170 L192 186" fill="none" stroke-width="10"/>
        <circle cx="150" cy="170" r="9" fill="#2b2b2b"/>
      </g>
    </svg>
    <div class="lb" id="s1-ring" style="left:80px;top:360px;transform-origin:left"><span class="tx boilT" style="font-size:118px;color:var(--coral)">กริ๊งงง!</span></div>
    <svg class="art boil" id="s1-bed" viewBox="0 0 900 620" style="left:90px;top:800px;width:900px;height:620px">
      <ellipse cx="450" cy="585" rx="430" ry="26" fill="#00000014"/>
      <rect class="o" x="30" y="110" width="150" height="430" rx="46" fill="#ffb4a2"/>
      <rect class="o" x="30" y="330" width="840" height="200" rx="40" fill="#ffb4a2"/>
      <path class="o" d="M70 530 V575 M830 530 V575" fill="none" stroke-width="12"/>
      <ellipse class="o" cx="300" cy="300" rx="130" ry="62" fill="#fff"/>
      <g transform="translate(150 70) scale(0.85)" id="bed-mochi"></g>
      <g id="blanket" style="transform-origin:50% 100%">
        <path class="o" d="M175 352 C 320 318, 620 332, 868 352 L 872 530 L 170 530 Z" fill="#a0d2ff"/>
        <path d="M250 400 C 420 380, 640 390, 840 404 M240 455 C 420 436, 640 446, 845 460" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      </g>
    </svg>
    <span class="z" id="z0">z</span><span class="z" id="z1" style="font-size:58px">z</span><span class="z" id="z2" style="font-size:44px">z</span>
    <div class="lb" id="s1-bubble" style="left:330px;top:640px">
      <div class="bubble boilT"><span class="tx" style="font-size:60px">ขออีก 5 นาที...</span></div>
      <svg viewBox="0 0 80 70" style="position:absolute;left:30px;top:150px;width:80px;height:70px;overflow:visible" class="boil">
        <circle class="o" cx="30" cy="16" r="16" fill="#fff" stroke-width="6"/><circle class="o" cx="8" cy="54" r="9" fill="#fff" stroke-width="5"/>
      </svg>
    </div>
  </div>

  <!-- 2 · drags himself to the kitchen and finds coffee -->
  <div class="scene" id="s2">
    <div class="ln" id="s2-title" style="top:230px"><span class="tx boilT" style="font-size:86px">ต้องพึ่งตัวช่วย...</span></div>
    <svg class="art boil" id="s2-floor" viewBox="0 0 1080 40" style="left:0;top:1250px;width:1080px;height:40px">
      <path id="floor-line" class="o" d="M40 18 C 300 6, 700 30, 1040 14" fill="none" stroke-width="9"/>
    </svg>
    <svg class="art boil" id="s2-counter" viewBox="0 0 460 150" style="left:570px;top:1120px;width:460px;height:150px">
      <path class="o" d="M10 30 H450 V140 H10 Z" fill="#ffd6c9"/><path class="o" d="M0 30 H460" fill="none" stroke-width="14"/>
      <path class="o" d="M60 70 H190 M270 70 H400" fill="none" stroke-width="6"/>
    </svg>
    <svg class="art boil" id="s2-mochi" viewBox="0 0 400 400" style="left:100px;top:850px;width:420px;height:420px"></svg>
    <svg class="art boil" id="s2-steam" viewBox="0 0 200 230" style="left:690px;top:690px;width:200px;height:230px">
      <path id="steam0" class="o" d="M50 220 C 20 180, 80 150, 50 110 S 70 40, 50 10" fill="none" stroke="#b9a99a" stroke-width="10"/>
      <path id="steam1" class="o" d="M100 220 C 70 180, 130 150, 100 110 S 120 40, 100 10" fill="none" stroke="#b9a99a" stroke-width="10"/>
      <path id="steam2" class="o" d="M150 220 C 120 180, 180 150, 150 110 S 170 40, 150 10" fill="none" stroke="#b9a99a" stroke-width="10"/>
    </svg>
    <svg class="art boil" id="s2-mug" viewBox="0 0 240 240" style="left:660px;top:910px;width:240px;height:240px">
      <path class="o" d="M172 92 C 232 92, 232 178, 172 172" fill="none" stroke-width="14"/>
      <path class="o" d="M40 56 H172 V196 Q172 232 136 232 H76 Q40 232 40 196 Z" fill="#a8e6cf"/>
      <ellipse class="o" cx="106" cy="58" rx="66" ry="14" fill="#8a5a3c" stroke-width="7"/>
      <path d="M106 168 C 80 146, 86 124, 106 136 C 126 124, 132 146, 106 168 Z" fill="#ff9eb5"/>
    </svg>
    <svg class="art boil" id="s2-spark" viewBox="0 0 460 420" style="left:560px;top:780px;width:460px;height:420px"></svg>
    <div class="lb" id="s2-sip" style="left:150px;top:720px"><div class="bubble boilT"><span class="tx" style="font-size:60px">จิบ~</span></div></div>
  </div>

  <!-- 3 · first sip: full power -->
  <div class="scene" id="s3">
    <svg class="art" id="s3-rays" viewBox="-100 -100 200 200" style="left:-360px;top:-40px;width:1800px;height:1800px"></svg>
    <svg class="art boil" id="s3-doodles" viewBox="0 0 1080 1920" style="left:0;top:0;width:1080px;height:1920px"></svg>
    <svg class="art boil" id="s3-mochi" viewBox="0 0 400 400" style="left:290px;top:610px;width:500px;height:500px"></svg>
    <svg class="art boil" id="s3-battery" viewBox="0 0 420 170" style="left:330px;top:1210px;width:420px;height:170px">
      <rect class="o" x="10" y="10" width="370" height="150" rx="30" fill="#fff"/>
      <rect class="o" x="382" y="55" width="28" height="60" rx="8" fill="#2b2b2b"/>
      <g id="segs"></g>
    </svg>
    <div class="ln" id="s3-title" style="top:300px"><span class="tx boilT" style="font-size:104px">ชาร์จพลังเต็ม!</span></div>
    <div id="confetti" style="position:absolute;inset:0;pointer-events:none"></div>
  </div>

  <!-- 4 · title card -->
  <div class="scene" id="s4">
    <svg class="art boil" id="s4-hearts" viewBox="0 0 1080 1920" style="left:0;top:0;width:1080px;height:1920px"></svg>
    <div class="ln" id="s4-t1" style="top:230px"><span class="tx boilT" style="font-size:176px;color:var(--coral)">โมจิ</span></div>
    <div class="ln" id="s4-t2" style="top:470px"><span class="tx boilT" style="font-size:104px">สู้วันจันทร์!</span></div>
    <svg class="art boil" id="s4-under" viewBox="0 0 560 50" style="left:260px;top:625px;width:560px;height:50px">
      <path id="under-line" class="o" d="M8 30 C 80 6, 150 46, 230 24 S 380 6, 440 28 S 520 40, 552 18" fill="none" stroke="#ff8a7a" stroke-width="12"/>
    </svg>
    <svg class="art boil" id="s4-mochi" viewBox="0 0 400 400" style="left:300px;top:760px;width:480px;height:480px"></svg>
    <div class="ln" id="s4-pill" style="top:1320px"><span class="pill boilT"><span class="tx" style="font-size:58px">ติดตามตอนต่อไป ♡</span></span></div>
  </div>
</div>
</div>
<div id="scrub"><input type="range" min="0" max="15" step="0.0333" value="0"><span>0.00s</span></div>

<script>
  // Every frame is a pure function of t (seconds). Effects come from lib/fx.js (catalogue at its top).
  const $ = (s) => document.querySelector(s);
  const { ease, clamp } = FX;
  const DUR = 15;

  const mochi = Mochi.svg;                                  // styles/cute-doodle/mochi.js
  $('#bed-mochi').innerHTML = mochi('sleep', 'sleep');
  $('#s2-mochi').innerHTML = `<g id="m2">${mochi('tired', 'sleep', { arm: true, alt: { eyes: 'happy', mouth: 'w' }, id: 'm2' })}</g>`;
  $('#s3-mochi').innerHTML = `<g id="m3">${mochi('sparkle', 'open')}</g>`;
  $('#s4-mochi').innerHTML = `<g id="m4">${mochi('happy', 'w', { wave: true, id: 'm4' })}</g>`;

  // ---- static doodles built once ----------------------------------------------------------
  const STAR = 'M0 -24 Q4 -4 24 0 Q4 4 0 24 Q-4 4 -24 0 Q-4 -4 0 -24 Z';
  const HEART = 'M0 14 C -26 -4, -18 -28, 0 -14 C 18 -28, 26 -4, 0 14 Z';
  $('#s2-spark').innerHTML = [[60, 160, 1.2], [400, 120, 1.5], [420, 330, 1]]
    .map(([x, y, s], i) => `<g transform="translate(${x} ${y}) scale(${s})"><path id="sp${i}" class="o" d="${STAR}" fill="#ffe08a" stroke-width="5"/></g>`).join('');
  $('#s3-rays').innerHTML = Array.from({ length: 16 }, (_, i) => {
    const a = (i / 16) * Math.PI * 2, b = ((i + 0.5) / 16) * Math.PI * 2, r = 150;
    return `<path d="M0 0 L${r * Math.cos(a)} ${r * Math.sin(a)} L${r * Math.cos(b)} ${r * Math.sin(b)} Z" fill="#ffe08a" opacity=".55"/>`;
  }).join('');
  const DOODLES = [[150, 560, STAR, '#ffe08a'], [930, 600, HEART, '#ff9eb5'], [120, 1000, HEART, '#a8e6cf'], [960, 980, STAR, '#a0d2ff'],
                   [210, 1250, STAR, '#ff9eb5'], [880, 1300, HEART, '#ffb4a2'], [130, 1470, HEART, '#a0d2ff'], [540, 1490, STAR, '#a8e6cf']];
  $('#s3-doodles').innerHTML = DOODLES.map(([x, y, d, c], i) =>
    `<g transform="translate(${x} ${y})"><path id="d${i}" class="o" d="${d}" fill="${c}" stroke-width="5" transform="scale(2.4)"/></g>`).join('');
  $('#segs').innerHTML = Array.from({ length: 5 }, (_, k) => `<rect id="seg${k}" x="${30 + k * 70}" y="30" width="58" height="110" rx="12" fill="#a8e6cf" stroke="#2b2b2b" stroke-width="5"/>`).join('');
  $('#s4-hearts').innerHTML = [[140, 1500, '#ff9eb5'], [300, 1650, '#ffb4a2'], [800, 1560, '#a0d2ff'], [930, 1700, '#ff9eb5'], [560, 1760, '#ffe08a']]
    .map(([x, y, c], i) => `<g transform="translate(${x} ${y})"><path id="h${i}" class="o" d="${HEART}" fill="${c}" stroke-width="5" transform="scale(2)"/></g>`).join('');

  // ---- timeline ---------------------------------------------------------------------------
  // [scene, in, out, {enter, exit}] — whip into the kitchen, zoom into the first sip, circle-reveal the title
  const SCENES = [
    ['#s1', -1, 2.9, { exit: 'whip' }],
    ['#s2', 2.9, 6.9, { enter: 'whip', exit: 'zoom' }],
    ['#s3', 6.9, 10.9, { enter: 'zoom', exit: 'hold' }],
    ['#s4', 10.9, 99, { enter: 'circle', dur: 0.7 }],
  ];
  // [element, start (s), {comes in from x/y/r/scale, dur, ease, sfx}]
  const ITEMS = [
    ['#s1-date',    0.0,  { y: -60, ease: 'back' }],
    ['#s1-bed',     0.0,  { y: 90, dur: 0.7 }],
    ['#s1-clock',   0.1,  { y: -140, ease: 'back', sfx: 'pop', vol: 0.5 }],
    ['#s1-ring',    0.45, { dur: 0.15 }],                                        // letters pop in (see render)
    ['#s1-bubble',  1.45, { scale: 0.3, ease: 'back', sfx: 'pop' }],

    ['#s2-mochi',   2.95, { x: -560, dur: 1.1 }],
    ['#s2-floor',   3.0,  { dur: 0.1 }],                                         // line draws itself (see render)
    ['#s2-title',   3.25, { dur: 0.2 }],                                         // words pop in
    ['#s2-counter', 3.4,  { y: 80, ease: 'back', sfx: 'pop', vol: 0.4 }],
    ['#s2-mug',     4.2,  { scale: 0, ease: 'spring', sfx: 'pop' }],
    ['#s2-spark',   4.5,  { dur: 0.2, sfx: 'ding', vol: 0.35 }],
    ['#s2-steam',   4.6,  { dur: 0.1 }],
    ['#s2-sip',     6.15, { scale: 0.3, ease: 'back', sfx: 'pop', vol: 0.6 }],

    ['#s3-rays',    6.9,  { scale: 0.4, dur: 0.8 }],
    ['#s3-mochi',   7.0,  { scale: 0.4, ease: 'spring', dur: 1.0, sfx: 'impact', vol: 0.6 }],
    ['#s3-doodles', 7.1,  { dur: 0.1 }],                                         // each doodle pops (see render)
    ['#s3-battery', 7.35, { y: 140, ease: 'back', sfx: 'whoosh', vol: 0.5 }],
    ['#s3-title',   8.9,  { dur: 0.2, sfx: 'impact' }],

    ['#s4-hearts',  11.0, { dur: 0.5 }],
    ['#s4-t1',      11.2, { y: -120, ease: 'spring', sfx: 'pop' }],
    ['#s4-t2',      11.5, { dur: 0.2 }],
    ['#s4-mochi',   11.35, { y: 220, ease: 'back', sfx: 'whoosh', vol: 0.5 }],
    ['#s4-under',   11.9, { dur: 0.1 }],
    ['#s4-pill',    12.4, { scale: 0.3, ease: 'back', sfx: 'ding', vol: 0.6 }],
  ];
  const SEG_AT = (k) => 7.65 + k * 0.24;
  // The sip: step up to the counter → raise a paw → lift the mug to the mouth → tilt and slurp
  const SIP = { step: 4.9, arm: 5.35, lift: 5.5, tilt: 5.95 };
  const MUG_TO = { x: -200, y: 80, r: -38 };     // where the mug travels to reach Mochi's mouth (px, deg)
  FX.cues(ITEMS, [
    [0.45, 'ring', 0.55],
    [SIP.tilt + 0.05, 'sip', 0.9],
    [2.9, 'whoosh', 0.7], [6.85, 'whoosh', 0.6], [10.9, 'whoosh', 0.6],
    ...DOODLES.map((_, i) => [7.15 + i * 0.07, 'pop', 0.22]),
    ...[0, 1, 2, 3, 4].map((k) => [SEG_AT(k), 'tick', 0.9]),
    [8.95, 'ding', 0.6],
  ]);

  function render(t) {
    FX.camera('#cam', t, DUR, { push: 0.08, shakes: [[0.45, 14], [8.9, 12]] });
    Boil.update(t);
    $('#dots').style.transform = `translateY(${-t * 10}px)`;
    FX.scenes(SCENES, t);
    if (t >= 3.5) $('#s1').style.opacity = 0;                      // fx.js 'whip' exit leaves the scene opaque off-screen
    FX.items(ITEMS, t);

    // 1 · alarm
    const ring = clamp((t - 0.45) / 0.08) * (1 - clamp((t - 2.2) / 0.4));
    $('#clock-body').style.transform = `rotate(${10 * ring * Math.sin(t * 55)}deg) translateY(${-8 * ring * Math.abs(Math.sin(t * 38))}px)`;
    $('#clock-lines').style.opacity = ring * (Math.sin(t * 40) > 0 ? 1 : 0.35);
    FX.chars('#s1-ring .tx', t, 0.45, { each: 0.06, y: -50 });
    $('#s1-ring').style.transform += ` rotate(${-5 + 2 * Math.sin(t * 9)}deg)`;
    $('#blanket').style.transform = `scaleY(${1 + 0.025 * Math.sin(t * 3.2)})`;
    [0, 1, 2].forEach((i) => {                                    // z z z drifting up from the pillow
      const ph = (t * 0.55 + i / 3) % 1, z = $('#z' + i);
      z.style.opacity = $('#s1').style.opacity * Math.sin(Math.PI * ph) * (t < 2.9 ? 1 : 0);
      z.style.transform = `translate(${560 + ph * 90 + i * 30}px, ${1010 - ph * 190}px) rotate(${-12 + 18 * ph}deg)`;
    });

    // 2 · kitchen
    const step = ease.inOut((t - SIP.step) / 0.6);
    const walking = Math.max(1 - clamp((t - 4.0) / 0.3), Math.sin(Math.PI * step));
    $('#m2').style.transform = `translate(${133 * step}px, ${-14 * walking * Math.abs(Math.sin(t * 9)) + 3 * Math.sin(t * 2.5)}px) rotate(${4 * walking * Math.sin(t * 9)}deg)`;
    const armUp = ease.back((t - SIP.arm) / 0.3), holding = t >= SIP.arm ? 1 : 0;
    $('#m2-paw').setAttribute('opacity', 1 - holding);
    $('#m2-arm').setAttribute('opacity', holding);
    $('#m2-arm').style.transform = `rotate(${45 * (1 - armUp)}deg)`;
    const lift = ease.inOut((t - SIP.lift) / 0.45), tilt = ease.inOut((t - SIP.tilt) / 0.3);
    const mug = `translate(${MUG_TO.x * lift}px, ${MUG_TO.y * lift - 90 * Math.sin(Math.PI * lift)}px)`;
    $('#s2-mug').style.transform += ` ${mug} rotate(${MUG_TO.r * tilt}deg)`;
    $('#s2-steam').style.transform += ` ${mug}`;
    $('#s2-steam').style.opacity *= 1 - tilt;
    $('#s2-spark').style.opacity *= 1 - lift;
    $('#m2-face').setAttribute('opacity', 1 - (tilt > 0.5 ? 1 : 0));          // eyes close in bliss mid-sip
    $('#m2-face2').setAttribute('opacity', tilt > 0.5 ? 1 : 0);
    FX.draw('#floor-line', t, 3.0, 0.5);
    FX.words('#s2-title .tx', t, 3.25, { each: 0.12 });
    [0, 1, 2].forEach((i) => {
      FX.draw('#steam' + i, t, 4.6 + i * 0.15, 0.5);
      $('#steam' + i).style.transform = `translateY(${-8 * Math.sin(t * 3 + i)}px)`;
    });
    [0, 1, 2].forEach((i) => { $('#sp' + i).style.transform = `scale(${0.75 + 0.3 * Math.abs(Math.sin(t * 4 + i * 1.7))}) rotate(${t * 40}deg)`; });

    // 3 · full power
    $('#s3-rays').style.transform += ` rotate(${t * 14}deg)`;
    const hop = Math.abs(Math.sin((t - 7) * 5));
    $('#m3').style.transform = `translateY(${-40 * hop}px) scale(${1 + 0.05 * (1 - hop)}, ${1 - 0.05 * (1 - hop)})`;
    DOODLES.forEach((_, i) => {
      const p = ease.back((t - 7.15 - i * 0.07) / 0.45);
      $('#d' + i).style.transform = `scale(${2.4 * p * (1 + 0.08 * Math.sin(t * 5 + i))}) rotate(${(i % 2 ? 1 : -1) * t * 30}deg)`;
    });
    for (let k = 0; k < 5; k++) {
      const p = ease.back((t - SEG_AT(k)) / 0.2);
      $('#seg' + k).style.opacity = clamp((t - SEG_AT(k)) / 0.06);
      $('#seg' + k).style.transform = `scaleY(${p})`;
    }
    FX.words('#s3-title .tx', t, 8.9, { each: 0.1, y: 70 });
    FX.burst('#confetti', t, 8.92, { x: 540, y: 620, n: 70, colors: ['#ffe08a', '#ff9eb5', '#a8e6cf', '#a0d2ff', '#ffb4a2'] });

    // 4 · title card
    FX.words('#s4-t2 .tx', t, 11.5, { each: 0.12 });
    FX.draw('#under-line', t, 11.9, 0.6);
    $('#m4').style.transform = `translateY(${4 * Math.sin(t * 3)}px)`;
    const wave = $('#m4-wave');
    if (wave) wave.style.transform = `rotate(${-10 + 22 * Math.sin(Math.max(0, t - 11.6) * 8)}deg)`;
    [0, 1, 2, 3, 4].forEach((i) => {
      const ph = ((t - 11) * 0.25 + i * 0.21) % 1;
      $('#h' + i).style.transform = `translateY(${-ph * 420}px) scale(${2 * (0.7 + 0.3 * Math.sin(t * 3 + i))})`;
      $('#h' + i).style.opacity = Math.sin(Math.PI * ph);
    });
    $('#s4-pill .pill').style.transform = `scale(${1 + 0.03 * Math.sin(Math.max(0, t - 12.9) * 6)})`;
  }
  window.render = render;

  // ?render → driven by render.mjs · ?t=5 → freeze at 5s · otherwise loop with a scrubber
  const params = new URLSearchParams(location.search);
  if (params.has('render')) { document.body.classList.add('render'); render(0); }
  else {
    const fit = () => {
      const s = Math.min(innerWidth / 1080, (innerHeight - 40) / 1920);
      $('#stage').style.transform = `translate(${(innerWidth - 1080 * s) / 2}px, 0) scale(${s})`;
    };
    fit(); addEventListener('resize', fit);
    const bar = $('#scrub input'), label = $('#scrub span');
    const show = (t) => { render(t); bar.value = t; label.textContent = t.toFixed(2) + 's'; };
    const frozen = params.has('t');
    let t0 = performance.now(), dragging = false;
    bar.addEventListener('input', () => { dragging = true; show(+bar.value); });
    bar.addEventListener('change', () => { dragging = false; t0 = performance.now() - bar.value * 1000; });
    const loop = () => { if (!dragging) show(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    if (frozen) show(+params.get('t')); else loop();
  }
</script>
</body>
</html>
