<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>kento lite promo</title>
<link rel="stylesheet" href="../../../fonts/mali.css">
<style>
  :root { --paper:#fff8ec; --ink:#2b2b2b; --peach:#ffb4a2; --mint:#a8e6cf; --butter:#ffe08a; --sky:#a0d2ff; --pink:#ff9eb5; --coral:#ff8a7a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--paper); color:var(--ink); font-family:'Mali', sans-serif; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; background:var(--paper); transform-origin:0 0; }
  #cam { position:absolute; inset:0; transform-origin:50% 50%; }
  #scrub { position:fixed; left:12px; right:12px; bottom:12px; display:flex; gap:12px; align-items:center; font:600 14px/1 sans-serif; color:#333; z-index:9; }
  #scrub input { flex:1; }
  .render #scrub { display:none; }

  .dots, .scene.solid { background-image:radial-gradient(#e8d9c2 4px, transparent 5px); background-size:60px 60px; }
  .dots { position:absolute; inset:-120px; }
  .scene { position:absolute; inset:0; opacity:0; }
  .scene.solid { background-color:var(--paper); }         /* scenes that enter with wipe/circle cover the one below */
  svg .o { stroke:var(--ink); stroke-width:8; stroke-linejoin:round; stroke-linecap:round; }
  svg * { transform-box:fill-box; transform-origin:center; }
  #s5-sky * { transform-box:view-box; transform-origin:0 0; }   /* sun rays use plain SVG rotate(a cx cy) */
  .art { position:absolute; opacity:0; overflow:visible; }
  .ln { position:absolute; left:0; right:0; text-align:center; white-space:nowrap; opacity:0; }
  .lb { position:absolute; white-space:nowrap; opacity:0; text-align:center; }
  .tx { display:inline-block; font-weight:700; line-height:1.3;
        text-shadow: -5px -5px 0 var(--paper), 5px -5px 0 var(--paper), -5px 5px 0 var(--paper), 5px 5px 0 var(--paper),
                     0 -6px 0 var(--paper), 0 6px 0 var(--paper), -6px 0 0 var(--paper), 6px 0 0 var(--paper), 8px 9px 0 #00000022; }
  .pill { display:inline-block; background:var(--butter); border:6px solid var(--ink); border-radius:999px; padding:6px 34px 12px; box-shadow:7px 8px 0 #00000026; }
  .pill.white { background:#fff; } .pill.mint { background:var(--mint); } .pill.pink { background:var(--pink); } .pill.sky { background:var(--sky); }
  .pill .tx, .card .tx { text-shadow:none; }
  /* real product photos sit in doodle sticker frames: white border, ink outline, tape on top */
  .photo { position:absolute; inset:0; background:#fff; border:7px solid var(--ink); border-radius:26px; padding:12px; box-shadow:10px 12px 0 #00000026; }
  .photo img { width:100%; height:100%; display:block; border-radius:14px; object-fit:cover; }
  .photo::before { content:''; position:absolute; left:50%; top:-26px; width:150px; height:46px; margin-left:-75px; background:#ffe08acc; transform:rotate(-4deg); }
  .card { position:absolute; inset:0; background:#fff; border:7px solid var(--ink); border-radius:34px; box-shadow:10px 12px 0 #00000026; }
  .menu .tx { font-size:34px; text-shadow:none; padding:0 8px; }   /* on a white card: no paper outline, so the highlight shows */
</style>
<script src="../../../lib/fx.js"></script>
<script src="../../../styles/cute-doodle/mochi.js"></script>
</head>
<body>
<script src="../../../styles/cute-doodle/boil.js"></script>  <!-- line boil: .boil drawings, .boilT text -->
<div id="stage">
<div id="cam">

  <div class="scene" id="s6"></div>
  <div class="scene" id="s7"></div>
  <div class="scene solid" id="s8"></div>
</div>
</div>
<div id="scrub"><input type="range" min="0" max="66" step="0.0333" value="0"><span>0.00s</span></div>

  // KENTO LITE · 60 s · cute-doodle. Every frame is a pure function of t. Product facts come only from brand/brand.md.
  const $ = (s) => document.querySelector(s);

  const STAR = 'M0 -24 Q4 -4 24 0 Q4 4 0 24 Q-4 4 -24 0 Q-4 -4 0 -24 Z';

  const mochi = Mochi.svg;                                  // styles/cute-doodle/mochi.js

  add('#s1', svg('s1-e2', 780, 590, 160, 220, '0 0 160 220', `<path class="o" d="${EGG}" fill="#fff"/><circle cx="80" cy="128" r="38" fill="#e6d48a" stroke="#8ea36b" stroke-width="10"/>`));

  add('#s1', label('s1-l1', 440, 840, 200, 'ดิบไป!', 38, 'white'));
  add('#s1', label('s1-l2', 760, 840, 200, 'แข็งไป!', 38, 'white'));

  add('#s8', `<div id="confetti" style="position:absolute;inset:0;pointer-events:none"></div>`);

  // ---- timeline (synced to brand/voice.mp3) -------------------------------------------------------
  // Voice sections: 1 problem 0 · 2 reveal 7.7 · 3 eggs 13.1 · 4 modes 26.8 · 5 timer 36.8 · 6 easy 43.5 · 7 trust 52.3 · 8 CTA 59.4

  const ITEMS = [
    ['#s1-a', 0.1, { dur: 0.2 }], ['#s1-b', 1.4, { scale: 1.8, ease: 'spring', dur: 0.8, sfx: 'impact', vol: 0.8 }],
    pop('#s1-e1', 3.9), ['#s1-l1', 4.05, { y: 40, ease: 'back' }],          // "ไม่ดิบไป"
    pop('#s1-e2', 4.9), ['#s1-l2', 5.05, { y: 40, ease: 'back' }],          // "ก็แข็งไป"
    pop('#s1-e0', 6.0), ['#s1-l0', 6.15, { y: 40, ease: 'back' }],          // "บางทีแตกอีก"
    ['#s1-mochi', 0.4, { y: 260, ease: 'back', dur: 0.7, sfx: 'whoosh', vol: 0.5 }],

    ['#s2-a', 7.65, { dur: 0.2, sfx: 'whoosh', vol: 0.6 }],                 // "ต้องมีตัวช่วยแล้ว"
    ['#s2-hero', 8.9, { scale: 0.2, r: -14, ease: 'spring', dur: 1.0, sfx: 'impact', vol: 0.6 }],
    ['#s2-name', 9.15, { y: 80, ease: 'back', sfx: 'pop' }],               // "Kento Lite"
    ['#s2-spark', 9.4, { dur: 0.3, sfx: 'ding', vol: 0.45 }],
    ['#s2-sub', 10.3, { dur: 0.2 }],                                        // "เครื่องต้มไข่อัตโนมัติ 12 ฟังก์ชัน"
    ['#s2-mochi', 11.2, { x: -200, ease: 'back', sfx: 'whoosh', vol: 0.4 }],

    ['#s3-a', 13.05, { dur: 0.2 }], ['#s3-b', 14.2, { y: 40, ease: 'back' }],
    ...EGGS.flatMap((_, i) => [pop(`#s3-c${i}`, EGG_AT(i) - 0.1, { sfx: 'tick', vol: 0.9 }), ['#s3-l' + i, EGG_AT(i) + 0.1, { y: 40, ease: 'back', sfx: 'pop', vol: 0.35 }]]),

    ['#s4-a', 26.8, { dur: 0.2 }],                                          // "แต่ไม่ได้มีแค่ต้มไข่นะ"
    ['#s4-board', 28.3, { y: 120, ease: 'back', sfx: 'whoosh', vol: 0.5 }], // "มีถึง 12 โหมด"
    ...MODES.map((_, i) => ['#s4-m' + i, 28.5 + i * 0.1, { x: -40, dur: 0.4, sfx: i % 3 ? undefined : 'tick', vol: 0.6 }]),
    ...DISHES.flatMap((_, k) => [pop(`#s4-d${k}`, DISH_AT(k) - 0.1, { vol: 0.45 }), ['#s4-dl' + k, DISH_AT(k) + 0.05, { y: 30, ease: 'back' }]]),

    ['#s5-a', 36.8, { dur: 0.2 }],                                          // "ตั้งเวลาล่วงหน้าได้ 24 ชั่วโมง"
    pop('#s5-clock', 37.0, { sfx: 'pop' }), ['#s5-sky', 37.2, { y: -60, ease: 'back' }],
    ['#s5-bed', 36.7, { y: 200, ease: 'back', dur: 0.7 }],
    ['#s5-b', 39.97, { y: 30, ease: 'back' }],                              // "ตื่นมาพร้อมทาน นอนต่อได้สบาย"
    ['#s5-meal', 40.3, { scale: 0.2, r: 18, ease: 'spring', dur: 0.9, sfx: 'ding', vol: 0.6 }],
    ['#s5-ready', 40.8, { y: 40, ease: 'back', sfx: 'pop' }],

    ['#s6-a', 43.5, { dur: 0.2 }],                                          // "ใช้ง่าย"
    ...FEATS.map((_, i) => pop(`#s6-f${i}`, FEAT_AT(i) - 0.1)),
    ['#s6-gift', 50.2, { scale: 0.3, ease: 'spring', dur: 0.8, sfx: 'ding', vol: 0.5 }],   // "แถมฟรีอุปกรณ์อีก 3 ชิ้น"
    ...[0, 1, 2].flatMap((k) => [pop(`#s6-g${k}`, 50.7 + k * 0.35), ['#s6-gl' + k, 50.85 + k * 0.35, { y: 30, ease: 'back' }]]),

    ['#s7-a', 52.1, { dur: 0.2 }],
    ['#s7-product', 52.2, { y: 200, ease: 'back', dur: 0.7, sfx: 'whoosh', vol: 0.5 }],
    ['#s7-dims', 53.4, { dur: 0.1 }], ['#s7-h', 53.8, { x: -40, ease: 'back', sfx: 'pop', vol: 0.4 }], ['#s7-w', 54.1, { y: 30, ease: 'back', sfx: 'pop', vol: 0.4 }],
    ...BADGES.map((_, i) => pop(`#s7-b${i}`, BADGE_AT(i), { sfx: i === 3 ? 'ding' : 'pop', vol: 0.5 })),

    ['#s8-a', 59.4, { scale: 0.3, ease: 'spring', dur: 0.9, sfx: 'impact', vol: 0.7 }],   // "Kento Lite!"
    ['#s8-photo', 60.0, { y: 300, r: 10, ease: 'back', dur: 0.8, sfx: 'whoosh', vol: 0.5 }],
    ['#s8-b', 60.5, { dur: 0.2 }],                                          // "ต้มไข่ได้ดั่งใจ ทุกเช้า"
    ['#s8-mochi', 61.3, { x: -260, ease: 'back', sfx: 'pop' }],
    ['#s8-cta', 62.7, { scale: 0.3, ease: 'back', sfx: 'ding', vol: 0.7 }], // "กดลิงก์ที่หน้าโปรไฟล์"
  ];
  FX.cues(ITEMS, [
    ...[7.3, 12.6, 26.4, 36.3, 43.1, 51.9, 59.0].map((at) => [at, 'whoosh', 0.7]),
    ...Array.from({ length: 10 }, (_, k) => [SPIN[0] + k * 0.24, 'tick', 0.5]),
    [WAKE, 'ring', 0.5],
  ]);

  const mixHex = (a, b, p) => '#' + [0, 2, 4].map((i) => Math.round(parseInt(a.substr(i + 1, 2), 16) * (1 - p) + parseInt(b.substr(i + 1, 2), 16) * p).toString(16).padStart(2, '0')).join('');

  function render(t) {
    FX.camera('#cam', t, DUR, { push: 0.04, shakes: [[1.4, 14], [8.9, 8], [WAKE, 12], [59.4, 12]] });
    Boil.update(t);
    $('#dots').style.transform = `translateY(${-t * 10}px)`;
    FX.scenes(SCENES, t);
    for (const [sel, out] of WHIP_OUT) if (t >= out + 0.6) $(sel).style.opacity = 0;
    FX.items(ITEMS, t);

    // 1 · eggs wobble, Mochi sweats
    [0, 1, 2].forEach((i) => { $('#s1-e' + i).style.transform += ` rotate(${4 * Math.sin(t * 5 + i)}deg)`; });
    $('#m1').style.transform = `translateY(${4 * Math.sin(t * 3)}px)`;
    $('#sweat').style.transform = `translateY(${10 * ((t * 1.2) % 1)}px)`;
    $('#sweat').style.opacity = 1 - ((t * 1.2) % 1);
    FX.words('#s1-a .tx', t, 0.1, { each: 0.15 });

    // 2 · reveal
    [0, 1, 2, 3].forEach((i) => { $('#sp' + i).style.transform = `scale(${0.7 + 0.35 * Math.abs(Math.sin(t * 4 + i * 1.3))}) rotate(${t * 50}deg)`; });
    $('#m2-wave').style.transform = `rotate(${-10 + 22 * Math.sin(Math.max(0, t - 11.5) * 8)}deg)`;
    FX.words('#s2-a .tx', t, 7.65, { each: 0.15 });
    FX.words('#s2-sub .tx', t, 10.3, { each: 0.08, y: 30 });
    $('#s2-hero').style.transform += ` rotate(${1.2 * Math.sin(t * 1.8)}deg)`;

    // 3 · egg guide
    FX.words('#s3-a .tx', t, 13.05, { each: 0.15 });
    EGGS.forEach((_, i) => { $('#s3-c' + i).style.transform += ` translateY(${5 * Math.sin(t * 2.5 + i)}px)`; });

    // 4 · menu board lights up the line of each dish as it appears
    FX.words('#s4-a .tx', t, 26.8, { each: 0.12 });
    SPOKEN.forEach(([m, at]) => FX.highlight(`#s4-m${m} .tx`, t, at, { color: '#ffe08a', height: 0.5, dur: 0.35 }));

    // 5 · night → morning: clock spins, moon becomes sun, Mochi wakes up to breakfast
    const night = 1 - ease.inOut((t - DAWN) / 1.0);
    $('#s5').style.backgroundColor = mixHex('#33406e', '#fff8ec', 1 - night);
    const spin = ease.inOut((t - SPIN[0]) / SPIN[1]);
    $('#mh').style.transform = `rotate(${spin * 360 * 8}deg)`;
    $('#hh').style.transform = `rotate(${spin * 360 * 0.66}deg)`;
    $('#moon').setAttribute('opacity', night);
    $('#sun').setAttribute('opacity', 1 - night);
    $('#sun').setAttribute('transform', `rotate(${t * 30} 100 100)`);   // spin around the sun's own centre
    const awake = t >= WAKE;
    $('#m5-face').setAttribute('opacity', awake ? 0 : 1);
    $('#m5-face2').setAttribute('opacity', awake ? 1 : 0);
    $('#m5wrap').style.transform = `translateY(${awake ? -30 * Math.abs(Math.sin((t - WAKE) * 6)) * Math.exp(-(t - WAKE)) : 0}px)`;
    $('#blanket5').style.transform = `scaleY(${1 + 0.025 * Math.sin(t * 3.2)})`;
    { const ph = (t * 0.6) % 1, z = $('#s5-z');
      z.style.opacity = (t > 37.0 && t < WAKE - 0.2 ? 1 : 0) * Math.sin(Math.PI * ph);
      z.style.transform = `translate(${470 + ph * 80}px, ${980 - ph * 160}px) rotate(${-10 + 16 * ph}deg)`; }

    // 6 · features
    FX.words('#s6-a .tx', t, 43.5, { each: 0.15 });
    [0, 1, 2].forEach((k) => { $('#s6-g' + k).style.transform += ` translateY(${4 * Math.sin(t * 3 + k)}px)`; });

    // 7 · dimensions draw on, badges pop
    FX.words('#s7-a .tx', t, 52.1, { each: 0.15 });
    FX.draw('#dimV', t, 53.4, 0.5);
    FX.draw('#dimH', t, 53.7, 0.5);
    $('#s7-b3').style.transform += ` scale(${1 + 0.04 * Math.sin(Math.max(0, t - 59.1) * 6)})`;

    // 8 · call to action
    FX.words('#s8-b .tx', t, 60.5, { each: 0.12 });
    $('#m8-wave').style.transform = `rotate(${-10 + 22 * Math.sin(Math.max(0, t - 61.7) * 8)}deg)`;
    $('#s8-cta .pill').style.transform = `scale(${1 + 0.04 * Math.sin(Math.max(0, t - 63.4) * 6)})`;
    $('#s8-photo').style.transform += ` rotate(${1.2 * Math.sin(t * 1.6)}deg)`;
    FX.burst('#confetti', t, 59.45, { x: 540, y: 300, n: 70, colors: ['#ffe08a', '#ff9eb5', '#a8e6cf', '#a0d2ff', '#ffb4a2'] });
  }
  window.render = render;

  // ?render → driven by render.mjs · ?t=5 → freeze at 5s · otherwise loop with a scrubber
  const params = new URLSearchParams(location.search);
  if (params.has('render')) { document.body.classList.add('render'); render(0); }
  else {
    const fit = () => {
      const s = Math.min(innerWidth / 1080, (innerHeight - 40) / 1920);
      $('#stage').style.transform = `translate(${(innerWidth - 1080 * s) / 2}px, 0) scale(${s})`;
    };
    fit(); addEventListener('resize', fit);
    const bar = $('#scrub input'), label = $('#scrub span');
    const show = (t) => { render(t); bar.value = t; label.textContent = t.toFixed(2) + 's'; };
    let t0 = performance.now(), dragging = false;
    bar.addEventListener('input', () => { dragging = true; show(+bar.value); });
    bar.addEventListener('change', () => { dragging = false; t0 = performance.now() - bar.value * 1000; });
    const loop = () => { if (!dragging) show(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
    if (params.has('t')) show(+params.get('t')); else loop();
  }
</script>
</body>
</html>
